[metadata]
name = collection-helpers
version = 0.1.0
description = Small helpers for collections and object updates.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_file = LICENSE

[options]
python_requires = >=3.8
package_dir =
    = src
packages = find:

[options.packages.find]
where = src

[options.extras_require]
dev =
    black
    pytest
